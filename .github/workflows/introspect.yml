name: probe-runner-context
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Session and process context
        shell: pwsh
        run: |
          Write-Host "=== Current process ==="
          $me = [System.Diagnostics.Process]::GetCurrentProcess()
          Write-Host "PID: $($me.Id)  SessionId: $($me.SessionId)"
          whoami /all

          Write-Host "=== Parent process chain ==="
          $procId = $me.Id
          for ($i = 0; $i -lt 10; $i++) {
            $proc = Get-CimInstance Win32_Process -Filter "ProcessId=$procId"
            if (-not $proc) { break }
            Write-Host "$($proc.ProcessId) $($proc.Name) (parent: $($proc.ParentProcessId))"
            $procId = $proc.ParentProcessId
            if ($procId -eq 0 -or $procId -eq 4) { break }
          }

          Write-Host "=== query session (все logon-сессии, Active помечена явно) ==="
          query session

          Write-Host "=== SESSIONNAME env var ==="
          Write-Host $env:SESSIONNAME

          Write-Host "=== explorer.exe presence (признак полноценного desktop) ==="
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId

          Write-Host "=== Winlogon / autologon settings ==="
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' |
            Select-Object AutoAdminLogon, DefaultUserName

          Write-Host "=== UAC state ==="
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA

          Write-Host "=== Runner-related services ==="
          Get-Service | Where-Object { $_.Name -like "*actions*" -or $_.DisplayName -like "*runner*" }

          Write-Host "=== Full command line of Runner.Worker/Runner.Listener ==="
          Get-CimInstance Win32_Process | Where-Object { $_.Name -like "*Runner*" } |
            Select-Object ProcessId, Name, ParentProcessId, ExecutablePath, CommandLine | Format-List
