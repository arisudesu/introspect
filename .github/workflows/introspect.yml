name: probe-explorer
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Explorer / shell investigation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $mySession = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Write-Host "Our SessionId: $mySession"

          Write-Host "`n=== 0. Есть ли explorer.exe на диске вообще (Core vs Desktop Experience) ==="
          Write-Host "explorer.exe exists: $(Test-Path C:\Windows\explorer.exe)"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' |
            Select-Object InstallationType, ProductName, EditionID | Format-List

          Write-Host "`n=== 1. ВСЕ процессы в нашей интерактивной сессии (по времени старта) ==="
          Get-CimInstance Win32_Process | Where-Object { $_.SessionId -eq $mySession } |
            Select-Object ProcessId, Name, CreationDate, ParentProcessId |
            Sort-Object CreationDate | Format-Table -AutoSize

          Write-Host "`n=== 2. Инфраструктура шелла: присутствует ли она (sihost/ctfmon/dwm/userinit) ==="
          foreach ($n in 'explorer','sihost','ctfmon','dwm','userinit','ShellExperienceHost','StartMenuExperienceHost','fontdrvhost') {
            $p = Get-Process -Name $n -ErrorAction SilentlyContinue
            if ($p) { $p | ForEach-Object { Write-Host "$n -> PID $($_.Id) session $($_.SessionId) started $($_.StartTime)" } }
            else    { Write-Host "$n -> НЕ запущен" }
          }

          Write-Host "`n=== 3. Тайминги: загрузка / старт сессии / старт агента ==="
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "LastBootUpTime: $($os.LastBootUpTime)"
          Write-Host "Now:            $(Get-Date)"
          Get-CimInstance Win32_LogonSession | Where-Object { $_.LogonType -in 2,10,11 } |
            Select-Object LogonId, LogonType, StartTime | Format-Table -AutoSize
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'hosted-compute|Runner\.' } |
            Select-Object Name, ProcessId, CreationDate, ParentProcessId | Format-Table -AutoSize

          Write-Host "`n=== 4. Блокировки запуска explorer: IFEO / политики ==="
          Write-Host "--- IFEO для explorer.exe ---"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\explorer.exe' | Format-List *
          Write-Host "--- HKLM System policies (Shell) ---"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' | Format-List *
          Write-Host "--- HKCU Winlogon (per-user Shell override) ---"
          Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' | Format-List *
          Write-Host "--- HKCU Explorer policies (NoDesktop и пр.) ---"
          Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer' | Format-List *
          Write-Host "--- Shell Launcher / Assigned Access ---"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\LogonUI\SessionData' | Format-List *
          Get-CimInstance -Namespace 'root\standardcimv2\embedded' -ClassName WESL_UserSetting | Format-List *

          Write-Host "`n=== 5. Аудит создания процессов (покажет, стартовал ли explorer вообще) ==="
          auditpol /get /subcategory:"Process Creation"
          Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4688} -MaxEvents 200 |
            Where-Object { $_.Message -match 'explorer|userinit' } |
            Select-Object -First 20 TimeCreated, @{n='Line';e={($_.Message -split "`n" | Where-Object { $_ -match 'New Process Name|Creator Process Name' }) -join ' | '}} |
            Format-Table -AutoSize -Wrap

          Write-Host "`n=== 6. Падал ли explorer (WER / Application Error) ==="
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName=@('Application Error','Windows Error Reporting','Application Hang')} -MaxEvents 50 |
            Where-Object { $_.Message -match 'explorer' } |
            Select-Object TimeCreated, Id, @{n='Msg';e={$_.Message.Substring(0,[Math]::Min(200,$_.Message.Length))}} | Format-List

          Write-Host "`n=== 7. Профиль пользователя: следы запуска шелла ==="
          $prof = "$env:SystemDrive\Users\$env:USERNAME"
          Write-Host "Profile: $prof"
          foreach ($p in @(
            "$prof\AppData\Local\Microsoft\Windows\Explorer",
            "$prof\AppData\Roaming\Microsoft\Windows\Recent",
            "$prof\NTUSER.DAT"
          )) {
            $i = Get-Item $p -Force -ErrorAction SilentlyContinue
            if ($i) { Write-Host "$p -> LastWrite: $($i.LastWriteTime)" } else { Write-Host "$p -> отсутствует" }
          }

          Write-Host "`n=== 8. Что лежит в каталоге агента (может содержать скрипт, убивающий шелл) ==="
          Get-ChildItem 'C:\ProgramData\GitHub' -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName, Length, LastWriteTime | Format-Table -AutoSize

          Write-Host "`n=== 9. Все задачи планировщика, трогающие explorer/shell ==="
          Get-ScheduledTask | Where-Object { $_.Actions.Execute -match 'explorer|taskkill|Stop-Process' } |
            ForEach-Object { Write-Host "$($_.TaskName): $($_.Actions.Execute) $($_.Actions.Arguments)" }

          Write-Host "`n=== 10. Повторная проверка через 30с (гипотеза 'explorer стартует позже') ==="
          Start-Sleep -Seconds 30
          $ex = Get-Process explorer -ErrorAction SilentlyContinue
          if ($ex) { $ex | Select-Object Id, SessionId, StartTime | Format-Table -AutoSize }
          else { Write-Host "explorer по-прежнему не запущен через 30 секунд после начала job" }

          exit 0
