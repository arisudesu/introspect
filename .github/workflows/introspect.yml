name: probe-logon-mechanism
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Deep logon mechanism probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          Write-Host "=== hosted-compute-agent: what actually hosts it ==="
          tasklist /svc /FI "PID eq 2624"
          Get-CimInstance Win32_Process -Filter "ProcessId=5152" |
            Select-Object ProcessId, Name, ExecutablePath, CommandLine | Format-List
          Get-CimInstance Win32_Process -Filter "ProcessId=2624" |
            Select-Object ProcessId, Name, ExecutablePath, CommandLine | Format-List

          Write-Host "=== Scheduled Tasks referencing runner/hosted/agent ==="
          Get-ScheduledTask | Where-Object {
            $_.TaskName -match 'runner|hosted|agent|actions' -or
            $_.Actions.Execute -match 'runner|hosted|agent'
          } | ForEach-Object {
            Write-Host "--- Task: $($_.TaskName) ---"
            Write-Host "State: $($_.State)"
            $_.Principal | Select-Object UserId, LogonType, RunLevel | Format-List
            $_.Actions | Select-Object Execute, Arguments | Format-List
          }

          Write-Host "=== Full Winlogon key dump ==="
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' |
            Format-List *

          Write-Host "=== LSA key (auth/notification packages, no secrets) ==="
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' |
            Select-Object 'Authentication Packages', 'Notification Packages', 'Security Packages', LimitBlankPasswordUse, DisableAutomaticRestartSignOn |
            Format-List

          Write-Host "=== Registered Credential Providers ==="
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\Credential Providers' |
            ForEach-Object {
              $name = (Get-ItemProperty $_.PSPath).'(default)'
              Write-Host "$($_.PSChildName)  =>  $name"
            }

          Write-Host "=== Win32_LogonSession joined with LoggedOnUser (LogonType/AuthPackage без нужды в auditpol) ==="
          $sessions = Get-CimInstance Win32_LogonSession
          foreach ($s in $sessions) {
            $users = Get-CimInstance Win32_LoggedOnUser | Where-Object {
              $_.Dependent -match "LogonId=`"$($s.LogonId)`""
            }
            if ($users) {
              Write-Host "LogonId=$($s.LogonId) Type=$($s.LogonType) AuthPkg=$($s.AuthenticationPackage) Start=$($s.StartTime)"
              $users | ForEach-Object { Write-Host "  -> $($_.Antecedent)" }
            }
          }

          Write-Host "=== hosted-compute-agent as a registered service (если вообще зарегистрирован в SCM) ==="
          Get-CimInstance Win32_Service | Where-Object { $_.Name -match 'hosted|compute' -or $_.DisplayName -match 'Hosted Compute' } |
            Select-Object Name, DisplayName, StartName, State, StartMode, PathName | Format-List

          Write-Host "=== Audit policy for logon events (объясняет, будут ли события 4624) ==="
          auditpol /get /subcategory:Logon

          Write-Host "=== Security log: попытки логона runneradmin (если аудит включён) ==="
          Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4624} -MaxEvents 10 |
            ForEach-Object {
              $xml = [xml]$_.ToXml()
              $data = $xml.Event.EventData.Data
              $user = ($data | Where-Object Name -eq 'TargetUserName').'#text'
              $logonType = ($data | Where-Object Name -eq 'LogonType').'#text'
              Write-Host "$($_.TimeCreated)  User=$user  LogonType=$logonType"
            }

          Write-Host "=== System log: запуск hosted-compute-agent / Schedule / связанных служб ==="
          Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'} -MaxEvents 100 |
            Where-Object { $_.Message -match 'hosted|runner|agent' } |
            Select-Object TimeCreated, Message | Format-List

          Write-Host "=== Каталог установки агента (если найдётся) ==="
          Get-ChildItem 'C:\Program Files','C:\Program Files (x86)','C:\ProgramData' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'hosted|compute|agent' } |
            ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 30 FullName, Length
            }
